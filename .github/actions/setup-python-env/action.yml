name: Setup Python environment
description: >
  Install Python 3.11 and project dependencies.
  Set dev-deps to true for jobs that need linting / type-checking tools.

inputs:
  dev-deps:
    description: Also install .[dev] extras and types-PyYAML
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        if [ "${{ inputs.dev-deps }}" = "true" ]; then
          pip install -e .[dev]
          pip install types-PyYAML
        fi

    - name: Verify package import
      shell: bash
      run: python -c "import src; print('src import OK')"
