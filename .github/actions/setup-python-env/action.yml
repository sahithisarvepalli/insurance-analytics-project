name: Setup Python environment
description: >
  Install Python 3.11 and project dependencies.
  Set dev-deps to true for jobs that need linting / type-checking tools.

inputs:
  dev-deps:
    description: Also install .[dev] extras and types-PyYAML
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # When running inside the shared devcontainer image, Python 3.11 is already
    # present at /usr/local/bin/python3.  actions/setup-python conflicts with
    # container-managed Python (it tries to write to /__t/ which doesn't exist),
    # so we skip it and use the system Python instead.
    - name: Detect system Python (skip setup-python inside containers)
      id: syspython
      shell: bash
      run: |
        if command -v python3 &>/dev/null && python3 -c "import sys; sys.exit(0 if sys.version_info >= (3,11) else 1)" 2>/dev/null; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/setup-python@v5
      if: steps.syspython.outputs.available != 'true'
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      shell: bash
      run: |
        python3 -m pip install --upgrade pip --quiet
        pip install -r requirements.txt --quiet
        pip install -e . --quiet
        if [ "${{ inputs.dev-deps }}" = "true" ]; then
          pip install -e .[dev] --quiet
          pip install types-PyYAML --quiet
        fi

    - name: Verify package import
      shell: bash
      run: python3 -c "import src; print('src import OK')"
