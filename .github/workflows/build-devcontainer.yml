name: Build & Push Dev Container Image

# Builds the shared dev container image from .devcontainer/Dockerfile and
# pushes it to GitHub Container Registry (GHCR).  Both the devcontainer and
# every CI job that needs a Python environment pull this same image, so the
# local and CI environments are always identical.
#
# Image tags produced:
#   :latest         – current HEAD of the default branch (post-merge)
#   :pr-<number>    – ephemeral image for the PR that changed the Dockerfile
#   :sha-<short>    – immutable per-commit tag for reproducibility
#   :buildcache     – registry-side layer cache (internal, never pulled directly)
#
# Lifecycle:
#   PR opens/updates  → builds :pr-<N> and :sha-<hash> so the changed image is
#                        immediately available to any CI jobs on that PR.
#   PR merges to main → builds :latest and :sha-<hash> (the stable, production tag).
#   workflow_dispatch → manual rebuild on any branch on demand.

on:
  push:
    branches: [main, master]
    paths:
      - ".devcontainer/Dockerfile"
      - ".devcontainer/setup.sh"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/build-devcontainer.yml"
  pull_request:
    branches: [main, master]
    paths:
      - ".devcontainer/Dockerfile"
      - ".devcontainer/setup.sh"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch: # manual trigger to force a rebuild on demand

permissions:
  contents: read
  packages: write # required to push packages to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/insurance-analytics-devcontainer

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Authenticate to GHCR ─────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Determine image tags & OCI labels ───────────────────────────────────
      # On a push to main     → :latest + :sha-<hash>
      # On a pull_request     → :pr-<number> + :sha-<hash>  (no :latest overwrite)
      # On workflow_dispatch  → :latest + :sha-<hash>  (intentional bootstrap/hotfix)
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # :latest on push to default branch OR on a manual workflow_dispatch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' }}
            # :pr-42 for every pull request (ephemeral; deleted when PR closes)
            type=ref,event=pr
            # immutable per-commit tag: sha-abc1234
            type=sha,prefix=sha-

      # ── Enable multi-platform builds & inline cache ──────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build & push with registry-side layer cache ──────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pull the previous build's layers from GHCR to maximise cache hits.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          # Write updated layers back to the buildcache tag after every build.
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
