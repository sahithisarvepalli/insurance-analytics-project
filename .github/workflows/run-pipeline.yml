name: Run ETL Pipeline (reusable)

# ── Reusable workflow ────────────────────────────────────────────────────────
# Called by ci-postgres.yml (test job) and scheduled-pipeline.yml.
# Owns the Postgres service container so neither caller has to repeat it.
#
# Usage:
#   jobs:
#     pipeline:
#       uses: ./.github/workflows/run-pipeline.yml
#       with:
#         seed-db: true          # seed fixed test data instead of Kaggle ingest
#         upload-outputs: false  # skip artifact upload (CI doesn't need it)
#       secrets: inherit

on:
  workflow_call:
    inputs:
      seed-db:
        description: >
          When true, seed the DB with fixed test fixtures via seed_test_db.py.
          When false, run a live Kaggle ingest (requires KAGGLE_* secrets).
        type: boolean
        required: false
        default: false
      upload-outputs:
        description: Upload pipeline output CSVs and Excel report as an artifact.
        type: boolean
        required: false
        default: false
      load-dw:
        description: Build the DuckDB data warehouse from Postgres and CSV outputs.
        type: boolean
        required: false
        default: false
      artifact-retention-days:
        description: How long to keep the uploaded artifact (days).
        type: number
        required: false
        default: 30
    secrets:
      KAGGLE_USERNAME:
        required: false
      KAGGLE_KEY:
        required: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # allow checkout of source code
      packages: read  # allow pulling the GHCR devcontainer image

    # Run every step inside the shared devcontainer image from GHCR so the CI
    # environment is identical to the local dev container.
    # The tag is chosen to match what build-devcontainer.yml published for this
    # exact event: pr-<N> for pull requests, :latest for the default branch, or
    # sha-<hash> for other branch pushes.
    container:
      image: ghcr.io/${{ github.repository_owner }}/insurance-analytics-devcontainer:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'latest' || format('sha-{0}', github.sha) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurdb
        options: >-
          --health-cmd="pg_isready -U postgres -d insurdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/insurdb
      PYTHONPATH: ${{ github.workspace }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env

      # ── Data ingest ─────────────────────────────────────────────────────────
      - name: Seed test database
        if: inputs.seed-db == true
        run: python .github/scripts/seed_test_db.py

      - name: Ingest Kaggle dataset
        if: inputs.seed-db == false
        run: python -m src.load --kaggle-config config/kaggle.yaml

      # ── ETL pipeline ────────────────────────────────────────────────────────
      - name: Run ETL pipeline
        uses: ./.github/actions/run-etl

      # ── DW load ─────────────────────────────────────────────────────────────
      - name: Load DuckDB data warehouse
        if: inputs.load-dw == true
        run: python -m src.dw_load

      # ── Upload outputs ──────────────────────────────────────────────────────
      - name: Upload pipeline outputs
        if: inputs.upload-outputs == true
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_number }}
          path: |
            outputs/kpis.csv
            outputs/monthly.csv
            outputs/loss_ratio.csv
            outputs/network_summary.csv
            outputs/diagnosis_summary.csv
            outputs/model_metrics.txt
            outputs/insurance_summary.xlsx
            outputs/insurance_dw.duckdb
          retention-days: ${{ inputs.artifact-retention-days }}
