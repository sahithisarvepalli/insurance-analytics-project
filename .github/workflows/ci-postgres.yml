
name: CI - Python + PostgreSQL

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'sonar-project.properties'
      - '.github/workflows/ci-postgres.yml' # Run if the CI config itself changes
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  # JOB 1: Static Analysis and Linting
  # This job checks code style and security without running any code.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
          pip install types-PyYAML

      - name: Run pre-commit hooks
        run: |
          pre-commit install
          pre-commit run --all-files

      - name: Code quality checks
        run: |
          echo "🔍 Running comprehensive code quality checks..."
          # Format checking
          black --check --diff src tests concepts
          isort --check-only --diff src tests concepts

          # Linting
          flake8 src tests concepts
          pylint src tests concepts || true  # Allow warnings to proceed

          # Type checking
          mypy src

          # Security scanning
          bandit -r src -c pyproject.toml

          # Complexity analysis
          radon cc src -a -nb
          radon mi src -nb

          # Dead code detection
          vulture src || true

          # Import analysis
          cohesion -d src

  # JOB 2: Database Integration Tests
  # This job spins up a real Postgres container to run functional tests.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11" ]

    # Service containers to run with this job
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurdb
        options: >-
          --health-cmd="pg_isready -U postgres -d insurdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/insurdb

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply DDL
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "postgresql://postgres:postgres@localhost:5432/insurdb" -c "CREATE SCHEMA IF NOT EXISTS insurance;"
          psql "postgresql://postgres:postgres@localhost:5432/insurdb" -f sql/ddl_create_tables.sql

      - name: Seed data
        run: |
          python -m src.generate_synthetic --rows-members 2000 --rows-providers 300 --rows-claims 5000 --out-dir data/
          python -m src.load --from-csv --members data/sample_members.csv --providers data/sample_providers.csv --claims data/sample_claims.csv

      - name: Run transforms & tests
        run: |
          python -m src.transform
          # Generate coverage.xml and junit-report.xml for SonarCloud
          pytest -q --junitxml=junit-report.xml --cov=src --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # v4+ requires a token for most uploads
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      # IMPORTANT: Save the test results so the next job (Sonar) can read them
      # without needing to restart the database.
      - name: Archive test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.xml
            junit-report.xml

  # JOB 3: SonarCloud Analysis
  # This job reports metrics to SonarCloud. It depends on 'test' completing.
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test # Ensures tests pass and artifacts are ready before starting
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Retrieve the reports generated in the 'test' job
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint bandit radon

      - name: Generate static reports
        run: |
          # These filenames MUST match what's in your sonar-project.properties
          pylint src --output-format=parseable > pylint-report.txt || true
          bandit -r src -f json -o bandit-report.json || true

      - name: SonarCloud Scan
        # Using the official SonarSource action
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=sahithisarvepalli
            -Dsonar.projectKey=sahithisarvepalli_insurance-analytics-project
            -Dsonar.host.url=https://sonarcloud.io
