
name: CI - Python + PostgreSQL

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'sql/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'sonar-project.properties'
      - '.github/workflows/ci-postgres.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'

permissions:
  contents: read        # allow checkout of source code
  pull-requests: write  # allow SonarCloud & Copilot agent to post PR comments/suggestions
  security-events: write # allow uploading SARIF / security scan results

jobs:
  # ── JOB 1: Static Analysis & Linting ────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
          pip install types-PyYAML

      - name: Format check (black + isort)
        run: |
          black --check --diff src tests
          isort --check-only --diff src tests

      - name: Lint (flake8 + pylint)
        run: |
          flake8 src tests
          pylint src || true   # treat warnings as non-blocking

      - name: Type check (mypy)
        run: mypy src

      - name: Security scan (bandit)
        run: bandit -r src -c pyproject.toml

      - name: Complexity (radon)
        run: |
          radon cc src -a -nb
          radon mi src -nb

  # ── JOB 2: Database Integration Tests ───────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurdb
        options: >-
          --health-cmd="pg_isready -U postgres -d insurdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/insurdb
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Verify editable install
        run: |
          echo "Verifying editable package import..."
          python -c "import importlib; importlib.import_module('src'); print('src import OK')"

      - name: Apply DDL
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "postgresql://postgres:postgres@localhost:5432/insurdb" -c "CREATE SCHEMA IF NOT EXISTS insurance;"
          psql "postgresql://postgres:postgres@localhost:5432/insurdb" -f sql/ddl_create_tables.sql

      - name: Seed data
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/insurdb" <<'SQL'
          INSERT INTO insurance.member (person_id, dob, gender, region, effective_date)
          VALUES (1, '1980-01-15', 'M', 'Northeast', '2020-01-01'),
                 (2, '1975-06-20', 'F', 'Southeast', '2019-03-01'),
                 (3, '1990-11-05', 'M', 'West',      '2021-07-01');
          INSERT INTO insurance.provider (specialty, in_network, region)
          VALUES ('General Practice', true,  'Northeast'),
                 ('Cardiology',       false, 'Southeast'),
                 ('Orthopedics',      true,  'West');
          INSERT INTO insurance.claim
            (member_id, provider_id, service_date, diagnosis_code,
             procedure_code, billed_amount, allowed_amount, paid_amount, place_of_service)
          VALUES (1, 1, '2023-03-10', 'E11.9',  '99213', 200.00, 160.00, 128.00, 'Office'),
                 (2, 2, '2023-05-22', 'I10',    '93000', 500.00, 350.00, 280.00, 'Outpatient'),
                 (3, 3, '2023-08-14', 'M54.5',  '27447', 800.00, 600.00, 480.00, 'Office');
          SQL

      - name: Run transforms & tests
        run: |
          python -m src.transform
          pytest -q -m integration \
            --junitxml=junit-report.xml \
            --cov=src \
            --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.xml
            junit-report.xml

  # ── JOB 3: SonarCloud Analysis ───────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read        # checkout source for scanning
      pull-requests: write  # post SonarCloud Quality Gate status on PRs
      security-events: write # upload SARIF results to GitHub Security tab

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
          pip install types-PyYAML

      - name: Generate static reports
        run: |
          pylint src --output-format=parseable > pylint-report.txt || true
          bandit -r src -f json -o bandit-report.json || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=sahithisarvepalli
            -Dsonar.projectKey=sahithisarvepalli_insurance-analytics-project
            -Dsonar.host.url=https://sonarcloud.io
