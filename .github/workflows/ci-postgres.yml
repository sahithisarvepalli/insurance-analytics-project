
name: CI - Python + PostgreSQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Run pre-commit hooks
        run: |
          pre-commit install
          pre-commit run --all-files

      - name: Code quality checks
        run: |
          echo "🔍 Running comprehensive code quality checks..."
          # Format checking
          black --check --diff src tests concepts
          isort --check-only --diff src tests concepts

          # Linting
          flake8 src tests concepts
          pylint src tests concepts || true  # Allow warnings

          # Type checking
          mypy src

          # Security scanning
          bandit -r src -c pyproject.toml

          # Complexity analysis
          radon cc src -a -nb
          radon mi src -nb

          # Dead code detection
          vulture src || true

          # Import analysis
          cohesion src

      - name: Static analysis report
        run: |
          echo "📊 Generating static analysis reports..."
          mkdir -p reports
          radon cc src --json > reports/complexity.json
          radon mi src --json > reports/maintainability.json
          radon hal src > reports/halstead.txt
          bandit -r src -f json -o reports/security.json || true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11" ]

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurdb
        options: >-
          --health-cmd="pg_isready -U postgres -d insurdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/insurdb

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply DDL
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "postgresql://postgres:postgres@localhost:5432/insurdb" -c "CREATE SCHEMA IF NOT EXISTS insurance;"
          psql "postgresql://postgres:postgres@localhost:5432/insurdb" -f sql/ddl_create_tables.sql

      - name: Seed data
        run: |
          python -m src.generate_synthetic --rows-members 2000 --rows-providers 300 --rows-claims 5000 --out-dir data/
          python -m src.load --from-csv --members data/sample_members.csv --providers data/sample_providers.csv --claims data/sample_claims.csv

      - name: Run transforms & tests
        run: |
          python -m src.transform
          pytest -q --junitxml=junit-report.xml --cov=src --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Generate test coverage and reports
        run: |
          # Run tests with coverage
          pytest --cov=src --cov-report=xml --junitxml=junit-report.xml

          # Generate additional reports for SonarCloud
          pylint src --output-format=parseable > pylint-report.txt || true
          bandit -r src -f json -o bandit-report.json || true
          radon cc src --json > radon-cc-report.json || true
          radon mi src --json > radon-mi-report.json || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_insurance-analytics-project
