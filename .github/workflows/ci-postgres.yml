name: CI - Python + PostgreSQL

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/**"
      - "src/sql/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "sonar-project.properties"
      - ".github/workflows/ci-postgres.yml"
      - ".github/workflows/client-analytics.yml"
      - ".github/workflows/run-pipeline.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read # allow checkout of source code
  pull-requests: write # allow SonarCloud & Copilot agent to post PR comments/suggestions
  security-events: write # allow uploading SARIF / security scan results
  pages: write # required by client-analytics.yml publish-dashboard job (called via workflow_call)
  id-token: write # required by client-analytics.yml publish-dashboard job (called via workflow_call)

jobs:
  # ── JOB 1: Static Analysis & Linting ────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          dev-deps: "true"

      - name: Format check (black + isort)
        run: |
          black --check --diff src tests
          isort --check-only --diff src tests

      - name: Lint (flake8 + pylint)
        run: |
          flake8 src tests
          pylint src || true   # treat warnings as non-blocking

      - name: Type check (mypy)
        run: mypy src

      - name: Security scan (bandit)
        run: bandit -r src -c pyproject.toml

      - name: Complexity (radon)
        run: |
          radon cc src -a -nb
          radon mi src -nb

  # ── JOB 2: ETL Smoke Test ────────────────────────────────────────────────────
  etl:
    needs: lint
    uses: ./.github/workflows/run-pipeline.yml
    with:
      seed-db: true # use fixed test fixtures, not live Kaggle data
      upload-outputs: false # CI only needs coverage/junit, not ETL outputs
    secrets: inherit

  # ── JOB 2b: Client analytics smoke test ─────────────────────────────────────
  # Runs the full per-client analytics pipeline (load → transform → model →
  # report) for every registered client in parallel.  This catches errors in
  # src/ code that would only surface at client-load time (e.g. type mismatches
  # between client CSVs and the DB schema) before they reach production.
  client-analytics:
    needs: lint
    uses: ./.github/workflows/client-analytics.yml
    with:
      client: "all"
    secrets: inherit

  # ── JOB 2c: Collect coverage & upload ────────────────────────────────────────
  # Each job gets a fresh runner, so this job spins up its own Postgres service
  # and re-seeds the database before running tests.
  coverage:
    runs-on: ubuntu-latest
    needs: [etl, client-analytics]
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/insurdb
      PYTHONPATH: ${{ github.workspace }}

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurdb
        options: >-
          --health-cmd="pg_isready -U postgres -d insurdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env

      - name: Initialise and seed test database
        run: python .github/scripts/seed_test_db.py

      - name: Run tests with coverage
        run: |
          mkdir -p build/reports
          pytest -q \
            --junitxml=build/reports/junit-report.xml \
            --cov=src \
            --cov-report=xml:build/reports/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/coverage.xml
            build/reports/junit-report.xml

  # ── JOB 3: SonarCloud Analysis ───────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: coverage
    permissions:
      contents: read # checkout source for scanning
      pull-requests: write # post SonarCloud Quality Gate status on PRs
      security-events: write # upload SARIF results to GitHub Security tab

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          dev-deps: "true"

      - name: Generate static reports
        run: |
          pylint src --output-format=parseable > pylint-report.txt || true
          bandit -r src -f json -o bandit-report.json || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=sahithisarvepalli
            -Dsonar.projectKey=sahithisarvepalli_insurance-analytics-project
            -Dsonar.host.url=https://sonarcloud.io
