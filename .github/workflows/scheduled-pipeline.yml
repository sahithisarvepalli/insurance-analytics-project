name: Scheduled Pipeline

on:
  # ── Cron: runs daily at midnight IST (12:00 AM IST = 18:30 UTC) ───────────
  schedule:
    - cron: "30 18 * * *"

  # ── Manual trigger so you can run it on-demand from the Actions tab ────────
  workflow_dispatch:

jobs:
  pipeline:
    uses: ./.github/workflows/run-pipeline.yml
    with:
      seed-db: false # live Kaggle ingest
      upload-outputs: true
      load-dw: true
      artifact-retention-days: 30
    secrets: inherit
