name: Scheduled Pipeline

on:
  # ── Cron: runs daily at 06:30 UTC (parallel to / independent of Airflow) ──
  schedule:
    - cron: "30 6 * * *"

  # ── Manual trigger so you can run it on-demand from the Actions tab ────────
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurdb
        options: >-
          --health-cmd="pg_isready -U postgres -d insurdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/insurdb
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # ── 1. Schema ----------------------------------------------------------
      - name: Initialise database schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "postgresql://postgres:postgres@localhost:5432/insurdb" \
            -c "CREATE SCHEMA IF NOT EXISTS insurance;"
          psql "postgresql://postgres:postgres@localhost:5432/insurdb" \
            -f sql/ddl_create_tables.sql

      # ── 2. Generate synthetic data -----------------------------------------
      - name: Generate synthetic data
        run: |
          python -m src.generate_synthetic \
            --rows-members 2000 --rows-providers 300 --rows-claims 5000 \
            --out-dir data/

      # ── 3. Load into Postgres (idempotent — truncates first) ----------------
      - name: Load CSVs into Postgres
        run: |
          python -m src.load --from-csv \
            --members  data/sample_members.csv \
            --providers data/sample_providers.csv \
            --claims   data/sample_claims.csv

      # ── 4. Transform (KPIs) ------------------------------------------------
      - name: Run transform / KPI aggregation
        run: python -m src.transform

      # ── 5. ML model --------------------------------------------------------
      - name: Run ML model
        run: python -m src.model

      # ── 6. Report -----------------------------------------------------------
      - name: Generate Excel report
        run: python -m src.report --out outputs/insurance_summary.xlsx

      # ── 7. Upload outputs as build artifact ---------------------------------
      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_number }}
          path: |
            outputs/kpis.csv
            outputs/monthly.csv
            outputs/model_metrics.txt
            outputs/insurance_summary.xlsx
          retention-days: 30
