# Kaggle dataset configuration
# ---------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------
# Provide your Kaggle API token via ONE of the following methods (in priority
# order):
#
#   1. Environment variables  (recommended for CI / containers)
#        export KAGGLE_USERNAME=your_username
#        export KAGGLE_KEY=your_api_key
#
#   2. Credential file  (recommended for local dev)
#        Place the JSON token downloaded from kaggle.com → Account → API at:
#        ~/.kaggle/kaggle.json
#
# See https://www.kaggle.com/docs/api for full setup instructions.
# ---------------------------------------------------------------------------

# Which dataset key under 'datasets' to activate for the current run.
# Override at runtime: DATA_SOURCE=kaggle python -m src.load --from-kaggle
active_dataset: insurance_charges

datasets:
  # -------------------------------------------------------------------------
  # Example 1 — Medical insurance charges (single-file dataset)
  # https://www.kaggle.com/datasets/mirichoi0218/insurance
  # Source columns: age, sex, bmi, children, smoker, region, charges
  # -------------------------------------------------------------------------
  insurance_charges:
    owner: mirichoi0218
    dataset: insurance
    dest_dir: data/kaggle/insurance_charges

    # Which files in the downloaded dataset map to which pipeline roles.
    # Supported roles: claims  |  members  |  providers
    # If members / providers are omitted they are derived automatically from
    # the unique member_id / provider_id values found in the claims file.
    files:
      claims: insurance.csv

    # Rename source column names to pipeline schema column names.
    # Any source column NOT listed here is passed through unchanged.
    column_map:
      claims:
        charges: paid_amount # monetary amount → paid_amount
        sex: gender # 'sex' column   → 'gender'

    # Static values injected for required pipeline columns absent in the
    # source file.  These are merged with schema defaults; values here win.
    defaults:
      claims:
        billed_amount: 0.0
        allowed_amount: 0.0
        place_of_service: Office
        procedure_code: "99213"
        service_date: "2023-01-01"
        diagnosis_code: Z00
        # member_id and provider_id are auto-assigned if absent

  # -------------------------------------------------------------------------
  # Dataset 3 — Healthcare dataset (hospital patient admissions)
  # https://www.kaggle.com/datasets/prasad22/healthcare-dataset
  # Source columns: Name, Age, Gender, Blood Type, Medical Condition,
  #   Date of Admission, Doctor, Hospital, Insurance Provider,
  #   Billing Amount, Room Number, Admission Type, Discharge Date,
  #   Medication, Test Results
  # ~10,000 rows — genuinely different from insurance_charges
  # -------------------------------------------------------------------------
  healthcare_admissions:
    owner: prasad22
    dataset: healthcare-dataset
    dest_dir: data/kaggle/healthcare_admissions

    files:
      claims: healthcare_dataset.csv

    column_map:
      claims:
        "Billing Amount": paid_amount # hospital billing  → paid_amount
        Gender: gender # Gender            → gender
        Age: age # Age               → age
        "Medical Condition": diagnosis_code # condition    → diagnosis_code
        "Date of Admission": service_date # admission dt  → service_date
        Hospital: region # hospital name     → region

    defaults:
      claims:
        billed_amount: 0.0
        allowed_amount: 0.0
        place_of_service: "Hospital"
        procedure_code: "99213"
