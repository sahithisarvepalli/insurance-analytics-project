# Client configuration for MedTrust Group
# ---------------------------------------------------------------------------
# Maps MedTrust's column schema to the pipeline schema.
# CSV files are supplied at runtime (not committed to the repo).
# Usage:
#   python -m src.load --client-config config/clients/client_b.yaml
# The 'files.claims' path should point to the client-supplied CSV on disk.
# ---------------------------------------------------------------------------

client_id: client_b
client_name: "MedTrust Group"

files:
  claims: data/clients/client_b/claims.csv

column_map:
  claims:
    member_no: member_id # broker member number    → member_id
    provider_ref: provider_id # provider reference code → provider_id
    claim_date: service_date # claim submission date   → service_date
    dx_code: diagnosis_code # diagnosis code          → diagnosis_code
    proc_code: procedure_code # procedure code          → procedure_code
    paid_usd: paid_amount # paid amount in USD      → paid_amount
    gender_code: gender # gender code (M/F)       → gender
    member_age: age # member age in years     → age
    territory: region # sales territory         → region

defaults:
  claims:
    billed_amount: 0.0
    allowed_amount: 0.0
    place_of_service: "Office"
