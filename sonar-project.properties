# SonarQube/SonarCloud configuration
sonar.projectKey=sahithisarvepalli_insurance-analytics-project
sonar.projectName=Insurance Analytics Project
sonar.projectVersion=1.0.0

# Source code
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/test_*.py

# Python specific
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit-report.xml

# Coverage
sonar.coverage.exclusions=**/test_*.py,**/conftest.py,notebooks/**,concepts/**

# Code quality
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json

# Exclusions
sonar.exclusions=**/*.pyc,**/__pycache__/**,**/migrations/**,notebooks/**,concepts/**,data/**,outputs/**,**/.git/**,**/.venv/**,**/.tox/**,**/.mypy_cache/**,**/.pytest_cache/**,**/.coverage/**,**/*egg-info/**

# Coverage settings
sonar.python.coverage.overallExclusions=**/test_*.py,**/conftest.py,notebooks/**,concepts/**

# Additional settings
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
