# ---------------------------------------------------------------------------
# Airflow local development stack (extends the existing dev-container compose)
# ---------------------------------------------------------------------------
# Usage:
#   docker compose -f airflow/docker-compose-airflow.yml up -d
#
# This file is intentionally standalone so you can run it side-by-side with
# your dev container without touching the existing .devcontainer/docker-compose.yml.
# ---------------------------------------------------------------------------

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    # Your project's database — used by the DAG tasks
    DATABASE_URL: postgresql://postgres:postgres@db:5432/insurdb
    AIRFLOW_PROJECT_DIR: /workspaces/insurance-analytics-project
    PYTHONPATH: /workspaces/insurance-analytics-project
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      pandas>=2.2 numpy>=1.26 sqlalchemy>=2.0 psycopg2-binary>=2.9
      scikit-learn>=1.4 openpyxl>=3.1 pyyaml>=6.0
  volumes:
    - ../airflow/dags:/opt/airflow/dags        # your DAGs folder
    - ../airflow/logs:/opt/airflow/logs        # task logs
    - ../airflow/plugins:/opt/airflow/plugins  # custom plugins (if any)
    - ../../insurance-analytics-project:/workspaces/insurance-analytics-project:cached
  networks:
    - insurance-network

services:
  # --- Airflow metadata database (separate from your analytics DB) ----------
  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insurance-network

  # --- One-shot: create Airflow tables + admin user -------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: >
      -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@example.com
          --password admin
      "
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  # --- Webserver (UI on port 8080) ------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Scheduler (picks up DAG runs) ---------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-pgdata:

networks:
  insurance-network:
    external: true   # reuse the network from .devcontainer/docker-compose.yml
