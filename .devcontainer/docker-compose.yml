name: insurance-analytics

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: vscode
    command: sleep infinity
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/insurdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - insurance-network

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insurdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - insurance-network

volumes:
  postgres-data:
    name: insurance-analytics-postgres-data

networks:
  insurance-network:
    driver: bridge
