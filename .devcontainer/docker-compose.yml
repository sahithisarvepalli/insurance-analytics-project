version: '3.8'
services:
  app:
    # Use the pre-built image from GHCR when available (set GITHUB_REPOSITORY_OWNER
    # in .devcontainer/.env for local dev, or rely on the Codespaces default).
    # Keeping `build:` lets the devcontainer fall back to a local build when the
    # GHCR image has not been pulled yet — run `docker compose pull app` to fetch it.
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/insurance-analytics-devcontainer:latest
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    working_dir: /workspaces/${localWorkspaceFolderBasename}
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/insurdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - insurance-network

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insurdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insurance-network

volumes:
  postgres-data:

networks:
  insurance-network:
