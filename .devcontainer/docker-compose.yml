name: insurance-analytics

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - workspace-data:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/insurdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - insurance-network

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insurdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - insurance-network

volumes:
  workspace-data:
  postgres-data:

networks:
  insurance-network:
