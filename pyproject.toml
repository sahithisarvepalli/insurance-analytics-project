[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-analytics"
version = "0.1.0"
description = "Insurance claims analytics and modeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<2.0.0",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "plotly>=5.18.0,<6.0.0",
    "kaggle>=1.6.0,<3.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "jupyterlab>=4.0.0,<5.0.0",
    "ipykernel>=6.27.0,<7.0.0",
    "notebook>=7.0.0,<8.0.0",
    "ipywidgets>=8.1.0,<9.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=24.1.0,<25.0.0",
    "flake8>=7.0.0,<8.0.0",
    "isort>=5.13.0,<6.0.0",
    "mypy>=1.8.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0,<1.0.0",
    "bandit>=1.7.0,<2.0.0",
    "radon>=6.0.0,<7.0.0",
    "pylint>=3.0.0,<4.0.0",
    "pre-commit>=3.6.0,<4.0.0",
    "safety>=2.3.0,<3.0.0",
    "vulture>=2.10,<3.0.0",
    "xenon>=0.9.0,<1.0.0",
    "cohesion>=1.0.0,<2.0.0",
    "eradicate>=2.3.0,<3.0.0",
    "dlint>=0.14.0,<1.0.0",
    "pydocstyle>=6.3.0,<7.0.0",
    "docformatter>=1.7.0,<2.0.0",
    "yapf>=0.40.0,<1.0.0",
    "autoflake>=2.2.0,<3.0.0",
    "pyupgrade>=3.15.0,<4.0.0",
    "add-trailing-comma>=3.1.0,<4.0.0",
    "reorder-python-imports>=3.12.0,<4.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-mock>=3.12.0,<4.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.sql" = ["*.sql"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs

  | \.git
  | \.hg
  | \.mypy_cache

  | \.tox
  | \.venv
  | build

  | dist
  | __pycache__
  | \.pytest_cache
  | notebooks
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src"]
skip = ["__init__.py", "notebooks"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
warn_unreachable = true
strict_equality = true
exclude = [
    "notebooks/",
    "concepts/",
    "tests/",
    "airflow/"
]

[tool.pylint]
max-line-length = 100
disable = [
    "C0103",  # Variable name doesn't conform to snake_case
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function or method docstring
    "R0903",  # Too few public methods
    "R0912",  # Too many branches
    "R0915",  # Too many statements
    "W0613",  # Unused argument
    "R0801",  # Similar lines in files
    "C0301",  # Line too long
    "E1101",  # Instance has no member
    "R0902",  # Too many instance attributes
    "W0212",  # Access to a protected member
    "C0413",  # Wrong import position
]
good-names = ["df", "X", "y", "i", "j", "k", "ex", "Run", "_"]
include-naming-hint = true

[tool.bandit]
exclude_dirs = ["tests", "notebooks", "concepts"]
skips = ["B101", "B601"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    ".tox",
    ".mypy_cache",
    ".pytest_cache",
    "notebooks",
    "concepts"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.radon]
exclude = "tests/*,notebooks/*,concepts/*"
cc_max = 10
mi_min = "A"

[tool.xenon]
exclude = "tests/*,notebooks/*,concepts/*"
max_average = "A"
max_modules = "A"
max_absolute = "B"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config --cov=src --cov-report=html:build/reports/htmlcov --cov-report=term-missing --cov-report=xml:build/reports/coverage.xml"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
    "notebooks/*",
    "concepts/*"
]
data_file = "build/reports/.coverage"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]
